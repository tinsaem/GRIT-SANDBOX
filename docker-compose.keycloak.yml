# =============================================================================
# Keycloak for local GIVT development.
#
#   docker compose -f docker-compose.keycloak.yml up -d
#
# Admin console:  http://localhost:8080/admin      (admin / admin)
# Realm endpoint: http://localhost:8080/realms/givt
#
# Keycloak gets its OWN database on port 5433. Do not point it at givt-db —
# Keycloak owns its schema and will not share nicely with Prisma migrations.
# Your app database stays on 5432, untouched.
# =============================================================================

services:
  keycloak-db:
    image: postgres:16
    container_name: givt-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_password
    ports:
      - "5433:5432"          # 5433 on the host so it cannot clash with givt-db
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    # Pin the version. Check https://www.keycloak.org for the current release
    # before changing this — 26.x is the line these instructions target.
    image: quay.io/keycloak/keycloak:26.0
    container_name: givt-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Realm, clients and roles are imported from here on first start, so you
      # do not have to click through the admin console.
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak_db_data:

# -----------------------------------------------------------------------------
# start-dev is for LOCAL ONLY. It disables HTTPS enforcement and uses a
# development-mode cache. A production deployment needs `start`, a real
# hostname, TLS certificates, and a clustered cache — see
# https://www.keycloak.org/server/configuration-production
# -----------------------------------------------------------------------------
